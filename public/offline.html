<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline, Ascend</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fdfbf7;
        color: #1a1a1a;
        font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: 24px;
      }
      .card { max-width: 26rem; text-align: center; }
      h1 { font-size: 1.5rem; margin: 0 0 0.5rem; letter-spacing: -0.02em; }
      p { color: #4a4a4a; line-height: 1.6; margin: 0 0 1.5rem; }
      a {
        display: inline-block;
        background: #e05a47;
        color: #fff;
        text-decoration: none;
        padding: 0.7rem 1.25rem;
        border-radius: 0.75rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>You are offline</h1>
      <p>
        Ascend needs a connection to load your matches. Anything you already opened
        this session is still cached. Try again once you are back online.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
